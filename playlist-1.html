    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 50px 20px;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .trail {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px 1px rgba(255,255,255,0.8);
    opacity: 0;
    animation: shoot 3.5s linear infinite;
  }

  .trail::before {
    content: '';
    position: absolute;
    top: 1px;
    left: 1px;
    width: 90px;
    height: 1px;
    background: linear-gradient(to left, rgba(255,255,255,0.9), rgba(255,255,255,0));
    transform: rotate(215deg);
    transform-origin: left center;
  }

  @keyframes shoot {
    0% { opacity: 0; transform: translate(0, 0); }
    5% { opacity: 1; }
    25% { opacity: 1; transform: translate(-180px, 130px); }
    30% { opacity: 0; transform: translate(-200px, 145px); }
    100% { opacity: 0; }
  }

  .playlist {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .playlist-title {
    color: #f2ecf9;
    font-size: 1.4rem;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 22px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }

  .song {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 18px;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 14px;
    backdrop-filter: blur(4px);
    text-decoration: none;
    color: #f2ecf9;
    text-align: left;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .song:hover, .song:active {
    background: rgba(255,255,255,0.16);
    transform: translateY(-2px);
  }

  .song svg {
    flex-shrink: 0;
    opacity: 0.85;
  }

  .song span {
    font-size: 0.95rem;
    font-weight: 400;
    letter-spacing: 0.3px;
  }
</style>
</head>
